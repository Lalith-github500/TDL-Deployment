<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Todo App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    .container {
      width: 400px;
      margin: 40px auto;
      background: white;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #e74c3c;
    }
    input {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
    }
    button {
      padding: 6px 10px;
      margin: 5px 0;
      cursor: pointer;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
    }
    .completed {
      text-decoration: line-through;
      color: gray;
    }
    .filters button {
      margin-right: 5px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="container" id="authBox">
  <h1>Login / Signup</h1>
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <button onclick="signup()">Signup</button>
  <button onclick="login()">Login</button>
</div>

<div class="container hidden" id="todoBox">
  <h1>todos</h1>

  <input id="taskInput" placeholder="What needs to be done?" onkeypress="if(event.key==='Enter') addTask()">

  <ul id="taskList"></ul>

  <div class="filters">
    <button onclick="loadTasks('all')">All</button>
    <button onclick="loadTasks('active')">Active</button>
    <button onclick="loadTasks('completed')">Completed</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<script>
const API = "";
let currentFilter = "all";

function getToken() {
  return localStorage.getItem("token");
}

function authHeaders() {
  return {
    "Authorization": "Bearer " + getToken()
  };
}

// ---------------- AUTH ----------------

function signup() {
  fetch("/signup", {
    method: "POST",
    body: new URLSearchParams({
      username: username.value,
      password: password.value
    })
  }).then(r => r.text()).then(alert);
}

function login() {
  fetch("/login", {
    method: "POST",
    body: new URLSearchParams({
      username: username.value,
      password: password.value
    })
  })
  .then(r => r.json())
  .then(data => {
    localStorage.setItem("token", data.token);
    showTodos();
  });
}

function logout() {
  localStorage.removeItem("token");
  location.reload();
}

// ---------------- TODOS ----------------

function showTodos() {
  authBox.classList.add("hidden");
  todoBox.classList.remove("hidden");
  loadTasks("all");
}

function loadTasks(filter) {
  currentFilter = filter;
  fetch(`/tasks?filter=${filter}`, {
    headers: authHeaders()
  })
  .then(r => r.json())
  .then(tasks => {
    taskList.innerHTML = "";
    tasks.forEach(t => {
      const li = document.createElement("li");
      li.innerHTML = `
        <span class="${t.completed ? 'completed' : ''}"
              onclick="toggleTask(${t.id})">${t.name}</span>
        <button onclick="deleteTask(${t.id})">x</button>
      `;
      taskList.appendChild(li);
    });
  });
}

function addTask() {
  fetch(`/add?name=${taskInput.value}`, {
    headers: authHeaders()
  }).then(() => {
    taskInput.value = "";
    loadTasks(currentFilter);
  });
}

function toggleTask(id) {
  fetch(`/toggle?id=${id}`, {
    headers: authHeaders()
  }).then(() => loadTasks(currentFilter));
}

function deleteTask(id) {
  fetch(`/delete?id=${id}`, {
    headers: authHeaders()
  }).then(() => loadTasks(currentFilter));
}

// AUTO LOGIN
if (getToken()) {
  showTodos();
}
</script>

</body>
</html>
