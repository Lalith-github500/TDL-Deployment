<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Todo App</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}
.container {
  width: 400px;
  margin: 40px auto;
  background: white;
  padding: 20px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}
h1 {
  text-align: center;
  color: #e74c3c;
}
input {
  width: 100%;
  padding: 8px;
  margin: 5px 0;
  box-sizing: border-box;
}
button {
  padding: 6px 10px;
  margin: 5px 0;
  cursor: pointer;
}
ul {
  list-style: none;
  padding: 0;
}
li {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  align-items: center;
}
li span {
  cursor: pointer;
  flex: 1;
}
.completed {
  text-decoration: line-through;
  color: gray;
}
.filters button {
  margin-right: 5px;
}
.hidden {
  display: none;
}
</style>
</head>

<body>

<!-- AUTH -->
<div class="container" id="authBox">
  <h1>Login / Signup</h1>
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <button onclick="signup()">Signup</button>
  <button onclick="login()">Login</button>
</div>

<!-- TODO -->
<div class="container hidden" id="todoBox">
  <h1>todos</h1>

  <input id="taskInput"
         placeholder="What needs to be done?"
         onkeypress="if(event.key==='Enter') addTask()">

  <ul id="taskList"></ul>

  <div class="filters">
    <button onclick="loadTasks('all')">All</button>
    <button onclick="loadTasks('active')">Active</button>
    <button onclick="loadTasks('completed')">Completed</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<script>
let currentFilter = "all";

// ---------------- TOKEN ----------------
function getToken() {
  return localStorage.getItem("token");
}

function authHeaders() {
  const token = getToken();
  if (!token) return {};
  return {
    "Authorization": "Bearer " + token
  };
}

// ---------------- AUTH ----------------
function signup() {
  const usernameVal = document.getElementById("username").value;
  const passwordVal = document.getElementById("password").value;
  
  if (!usernameVal || !passwordVal) {
    alert("Please enter username and password");
    return;
  }

  fetch("/signup", {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: new URLSearchParams({
      username: usernameVal,
      password: passwordVal
    })
  })
  .then(r => r.text())
  .then(msg => {
    alert(msg);
  })
  .catch(err => {
    alert("Signup error: " + err.message);
  });
}

function login() {
  const usernameVal = document.getElementById("username").value;
  const passwordVal = document.getElementById("password").value;
  
  if (!usernameVal || !passwordVal) {
    alert("Please enter username and password");
    return;
  }

  fetch("/login", {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: new URLSearchParams({
      username: usernameVal,
      password: passwordVal
    })
  })
  .then(async r => {
    const text = await r.text();
    if (!r.ok) {
      alert(text);
      throw new Error(text);
    }
    return JSON.parse(text);
  })
  .then(data => {
    localStorage.setItem("token", data.token);
    showTodos();
  })
  .catch(err => {
    console.error("Login error:", err);
  });
}

function logout() {
  localStorage.removeItem("token");
  location.reload();
}

// ---------------- UI ----------------
function showTodos() {
  document.getElementById("authBox").classList.add("hidden");
  document.getElementById("todoBox").classList.remove("hidden");
  loadTasks("all");
}

// ---------------- TASKS ----------------
function loadTasks(filter) {
  currentFilter = filter;

  fetch(`/tasks?filter=${filter}`, {
    headers: authHeaders()
  })
  .then(async r => {
    if (!r.ok) {
      console.error(await r.text());
      logout();
      return null;
    }
    return r.json();
  })
  .then(tasks => {
    if (!tasks) return;

    const taskList = document.getElementById("taskList");
    taskList.innerHTML = "";
    
    tasks.forEach(t => {
      const li = document.createElement("li");
      
      const span = document.createElement("span");
      span.className = t.completed ? 'completed' : '';
      span.textContent = t.name;
      span.onclick = () => toggleTask(t.id);
      
      const btn = document.createElement("button");
      btn.textContent = "x";
      btn.onclick = () => deleteTask(t.id);
      
      li.appendChild(span);
      li.appendChild(btn);
      taskList.appendChild(li);
    });
  })
  .catch(err => {
    console.error("Load tasks error:", err);
  });
}

function addTask() {
  const input = document.getElementById("taskInput");
  if (!input.value.trim()) return;

  fetch(`/add?name=${encodeURIComponent(input.value)}`, {
    headers: authHeaders()
  })
  .then(r => {
    if (!r.ok) {
      console.error("Failed to add task");
      return;
    }
    input.value = "";
    loadTasks(currentFilter);
  })
  .catch(err => {
    console.error("Add task error:", err);
  });
}

function toggleTask(id) {
  fetch(`/toggle?id=${id}`, {
    headers: authHeaders()
  })
  .then(r => {
    if (r.ok) {
      loadTasks(currentFilter);
    }
  })
  .catch(err => {
    console.error("Toggle task error:", err);
  });
}

function deleteTask(id) {
  fetch(`/delete?id=${id}`, {
    headers: authHeaders()
  })
  .then(r => {
    if (r.ok) {
      loadTasks(currentFilter);
    }
  })
  .catch(err => {
    console.error("Delete task error:", err);
  });
}

// ---------------- AUTO LOGIN ----------------
if (getToken()) {
  showTodos();
}
</script>

</body>
</html>
